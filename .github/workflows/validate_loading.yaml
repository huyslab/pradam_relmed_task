name: Playwright Tests

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.52.0  # Use the latest version

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Mark repository as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install dependencies
        run: npm install

      - name: Run Playwright tests
        # Set HOME to /root for Firefox to work properly
        env:
          HOME: /root
        run: npx playwright test --project="PRADAM loading tests" validation/playwright/load_test.spec.js || true # Continue even if error
      
      - name: Generate README Update
        run: node validation/update-readme-loading.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update loading test results in README" || exit 0
          git push

      - name: Fail if any task did not pass
        run: |
          node -e "
            const r = JSON.parse(require('fs').readFileSync('loading-test-results.json','utf8'));
            const bad = r.filter(e => [e.chromium, e.firefox, e.webkit].some(v => v !== true));
            if (bad.length) {
              console.error('Failed/unrun entries:');
              bad.forEach(e => console.error(\`  \${e.session}/\${e.task}: chromium=\${e.chromium} firefox=\${e.firefox} webkit=\${e.webkit}\`));
              process.exit(1);
            }
            console.log('All', r.length, 'entries passed in all browsers.');
          "

